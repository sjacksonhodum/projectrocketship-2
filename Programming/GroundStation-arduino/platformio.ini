; Ground station - Arduino/C++ (replaces the CircuitPython version in
; ../GroundStation). See the comment at the top of src/main.cpp for why.

[env:rpipico]
platform = https://github.com/maxgerhardt/platform-raspberrypi#develop
board = rpipico
framework = arduino
build_flags =
	-I ../shared
lib_deps =
	mikem/RadioHead
	adafruit/Adafruit NeoPixel@^1.15.5
	adafruit/Adafruit SSD1306@^2.5.13
	adafruit/Adafruit GFX Library@^1.11.11
