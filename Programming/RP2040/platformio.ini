; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:rpipico]
platform = https://github.com/maxgerhardt/platform-raspberrypi#develop
board = rpipico
framework = arduino
; This custom PCB is based on the Raspberry Pi Pico (not the Adafruit
; KB2040 - that was only ever borrowed for its pin-compatible RP2040
; toolchain config, and every actual pin here is remapped explicitly in
; main.cpp regardless). "pico"/rpipico uses boot2_w25q080_2_padded_
; checksum.S - the SAME boot2 already confirmed working on real hardware
; (see git history: a generic-boot2 experiment was tried and reverted) -
; just with the correct 2MB flash size for genuine Pico-class hardware
; instead of the KB2040's 8MB. Nothing in this firmware depends on the
; RP2040's own internal flash size - the flight-data log lives on a
; separate external I2C EEPROM chip, not here.
build_flags =
	-I ../shared
lib_deps =
	adafruit/Adafruit Unified Sensor@^1.1.15
	adafruit/Adafruit LSM6DS@^4.7.4
	mikem/RadioHead
	adafruit/Adafruit NeoPixel@^1.15.5
	adafruit/Adafruit MAX1704X@^1.0.3
